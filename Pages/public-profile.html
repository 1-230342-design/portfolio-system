<!-- ══════════════════════════════════════════
     Public Profile — viewable by anyone.
     Shows student name, meta, skills, and
     their public + approved works.
══════════════════════════════════════════ -->
<div class="screen" id="s-public-profile">
  <nav class="landing-nav">
    <div class="landing-logo" style="cursor:pointer;display:flex;align-items:center;gap:8px;" onclick="go('s-landing')">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;">
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><img src="images/asia.png" alt="ASIATECH" class="site-logo-img" style="height:17px;"></span>
        <span style="width:1px;height:16px;background:var(--border2);"></span>
        <img src="images/logo.png" alt="Artfolio" class="site-logo-img" style="height:18px;">
      </div>
      <span>Artfolio</span>
    </div>
    <div class="landing-nav-right">
      <button class="btn-login-nav" onclick="go('s-landing')">LOGIN</button>
    </div>
  </nav>

  <div class="section-page" style="max-width:900px;">
    <!-- Profile Header -->
    <div style="background:var(--dark-grad);border-radius:18px;padding:32px;margin-bottom:32px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden;">
      <div style="position:absolute;top:-60%;right:-8%;width:260px;height:260px;background:radial-gradient(circle,rgba(61,168,101,.35),transparent 70%);pointer-events:none;"></div>
      <div id="pp-avatar" style="width:80px;height:80px;border-radius:50%;background:var(--dark2);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;border:3px solid rgba(255,255,255,.2);flex-shrink:0;position:relative;z-index:1;"></div>
      <div style="position:relative;z-index:1;flex:1;min-width:0;">
        <div id="pp-name" style="font-family:'Fraunces',serif;font-size:26px;color:#fff;margin-bottom:6px;">Loading…</div>
        <div id="pp-meta" style="font-size:13px;color:rgba(255,255,255,.55);line-height:1.8;"></div>
        <div id="pp-skills" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"></div>
      </div>
    </div>

    <!-- Works Grid -->
    <div style="margin-bottom:12px;">
      <h2 style="font-family:'Fraunces',serif;font-size:22px;color:var(--dark);margin-bottom:4px;">Public Works</h2>
      <p style="font-size:13px;color:var(--text3);margin:0;">Approved works shared by this student</p>
    </div>
    <div id="pp-works" style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;"></div>
  </div>
</div>
