<!-- ══════════════════════════════════════════
     Public Work Detail — opened by scanning a
     work's QR code. No login required.
══════════════════════════════════════════ -->
<div class="screen" id="s-public-work">
  <nav class="landing-nav">
    <div class="landing-logo" style="cursor:pointer;display:flex;align-items:center;gap:8px;" onclick="go('s-landing')">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;">
        <img src="images/logo.png" alt="Artfolio" class="site-logo-img" style="height:18px;">
        <span style="width:1px;height:16px;background:var(--border2);"></span>
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><img src="images/asia.png" alt="ASIATECH" class="site-logo-img" style="height:17px;"></span>
      </div>
      <span>Artfolio</span>
    </div>
    <div class="landing-nav-right">
      <button class="btn-login-nav" onclick="go('s-landing')">LOGIN</button>
    </div>
  </nav>
  <div class="section-page" style="max-width:640px;">
    <div id="qw-body">
      <div style="font-size:13px;color:var(--text3);padding:40px 0;text-align:center;">Loading…</div>
    </div>
  </div>
</div>
