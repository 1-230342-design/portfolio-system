<!-- ══════════════════════════════════════════
     Public Student Portfolio — opened from public
     search ("View Portfolio"). No login required.
     Shows ONLY works the student marked public
     (approved works only). No grades, no professor
     comments — those stay private to the student.
     NOTE: this file used to wrongly contain a copy of
     the QR work screen (s-public-work), so the
     s-public-profile screen openPublicProfile() looks
     for never existed and every click died on a
     "Loading portfolio…" toast. This is the real one.
══════════════════════════════════════════ -->
<div class="screen" id="s-public-profile">
<style>
  /* green header — same dark green as the landing page and other public screens */
  #s-public-profile .landing-nav{background:#173f28;border-bottom:none;}
  #s-public-profile .landing-nav .btn-login-nav{background:#fff;color:#173f28;box-shadow:none;}
  #s-public-profile .landing-nav .btn-login-nav:hover{background:#f4ecd2;box-shadow:none;}
</style>
  <nav class="landing-nav">
    <div class="landing-logo" style="cursor:pointer;display:flex;align-items:center;gap:8px;color:#fff;" onclick="go('s-landing')">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:11px;">
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><img src="images/asia.png" alt="ASIATECH" class="site-logo-img" style="height:17px;"></span>
        <span style="width:1px;height:16px;background:rgba(255,255,255,.24);"></span>
        <img src="images/logo.png" alt="Artfolio" class="site-logo-img" style="height:18px;filter:brightness(0) invert(1);">
      </div>
      <span>Artfolio</span>
    </div>
    <div class="landing-nav-right">
      <button class="btn-login-nav" onclick="go('s-landing')">LOGIN</button>
    </div>
  </nav>
  <div class="section-page">
    <div style="margin-bottom:20px;cursor:pointer;color:var(--text3);font-size:13px" onclick="go('s-public-search')">← Back to search</div>
    <div class="portfolio-header">
      <div class="portfolio-header-inner">
        <div class="portfolio-avatar-lg" id="pp-avatar"></div>
        <div class="portfolio-info">
          <div class="portfolio-name" id="pp-name">—</div>
          <div class="portfolio-meta" id="pp-meta">—</div>
          <div class="portfolio-skills" id="pp-skills"></div>
        </div>
      </div>
    </div>
    <div class="section-title" style="margin:18px 0 14px;">Public Works</div>
    <div id="pp-works" class="portfolio-grid"></div>
  </div>
</div>
