<!-- ══════════════════════════════════════════
     Forgot Password Flow
══════════════════════════════════════════ -->
<div class="screen" id="s-forgot">
  <div class="auth-wrap" style="align-items:center;justify-content:center;background:var(--surface);">
    <div class="auth-card" style="max-width:400px;">

      <!-- STEP 1: EMAIL -->
      <div id="forgot-step-email">
        <div style="margin-bottom:16px;cursor:pointer;color:var(--text3)" onclick="go('s-login')">← back to login</div>
        <div class="auth-card-title">Forgot Password</div>
        <div class="auth-card-sub">Enter your email to receive a reset code</div>
        <label class="flabel">Email Address</label>
        <input class="finput" type="email" id="forgot-email" placeholder="example@gmail.com"/>
        <button class="btn-full" onclick="sendResetCode()">Send Reset Code</button>
      </div>

      <!-- STEP 2: OTP -->
      <div id="forgot-step-otp" style="display:none;text-align:center;">
        <div style="margin-bottom:16px;cursor:pointer;color:var(--text3);text-align:left" onclick="go('s-login')">← back to login</div>
        <div class="auth-card-title">Enter Reset Code</div>
        <p style="font-size:13px;color:var(--text3);margin:10px 0 6px;">We have sent a verification code to your email address</p>
        <div class="otp-row" id="otp-reset">
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
          <input class="otp-box" maxlength="1" oninput="otpNext(this)"/>
        </div>
        <div class="resend-link">This code expires in <span class="timer-text" id="timer-r">60</span> seconds. <a onclick="resendResetCode()">Resend Code</a></div>
        <button class="btn-full" style="margin-top:20px" onclick="verifyResetOtp()">VERIFY CODE</button>
      </div>

      <!-- STEP 3: NEW PASSWORD -->
      <div id="forgot-step-newpass" style="display:none;">
        <div class="auth-card-title">Set New Password</div>
        <div class="auth-card-sub">Choose a new password for your account</div>
        <label class="flabel">New Password</label>
        <input class="finput" type="password" id="reset-newpass" placeholder="Min. 6 characters"/>
        <label class="flabel">Confirm New Password</label>
        <input class="finput" type="password" id="reset-newpass2" placeholder="Re-enter password"/>
        <button class="btn-full" onclick="submitNewPassword()">Reset Password</button>
      </div>

    </div>
  </div>
</div>
