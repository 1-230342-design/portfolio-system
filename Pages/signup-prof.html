<!-- ══════════════════════════════════════════
     Sign Up — Professor
══════════════════════════════════════════ -->
<div class="screen" id="s-signup-prof">
  <div class="auth-wrap" style="align-items:center;justify-content:center;background:var(--surface);">
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.2;font-size:22px;display:flex;flex-wrap:wrap;gap:28px;padding:24px;align-content:flex-start;">
      🎨✏️📐🖌️📷🎭🖼️🗂️📌✂️🖍️📷🎬🎵🎼🖥️📱💡🔮🎲🎯📚🔭🏆🎨✏️📐🖌️
    </div>
    <div class="auth-card" style="max-width:440px;">
      <div style="margin-bottom:16px;cursor:pointer;color:var(--text3)" onclick="go('s-signup-choice')">← back</div>
      <div class="auth-card-title">Create account</div>
      <div class="auth-card-sub">Already have an account? <a onclick="go('s-login')">Login</a></div>
      <div class="finput-row">
        <div><label class="flabel">First Name</label><input class="finput" placeholder="First Name"/></div>
        <div><label class="flabel">Last Name</label><input class="finput" placeholder="Last Name"/></div>
      </div>
      <label class="flabel">Department</label>
      <select class="fselect" id="signup-prof-department">
        <option value="">Select Department</option>
        <option>BS Accountancy</option>
        <option>BS Tourism Management</option>
        <option>BS Hospitality Management</option>
        <option>BS Information Technology</option>
        <option>BS Information Technology Major in Multimedia Arts</option>
      </select>
      <div style="font-size:11px;color:var(--orange);margin-top:-12px;margin-bottom:14px;">Note: Only "IT Major in Multimedia Arts" professors can grade and approve/reject submissions. Other departments can view, rate, and comment on student work.</div>
      <label class="flabel">Email</label>
      <input class="finput" type="email" placeholder="example@gmail.com"/>
      <button class="btn-full" onclick="doSignupProf()">NEXT</button>
    </div>
  </div>
</div>
