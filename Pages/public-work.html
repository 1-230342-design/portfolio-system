<!-- ══════════════════════════════════════════
     Public Work Detail — opened by scanning a
     work's QR code. No login required.
══════════════════════════════════════════ -->
<div class="screen" id="s-public-work">
<style>
  /* green header — same dark green as the landing page and dashboards */
  #s-public-work .landing-nav{background:#173f28;border-bottom:none;}
  #s-public-work .landing-nav .btn-login-nav{background:#fff;color:#173f28;box-shadow:none;}
  #s-public-work .landing-nav .btn-login-nav:hover{background:#f4ecd2;box-shadow:none;}
  /* phone layout — the scanned page is mostly opened on phones, so keep
     everything inside the viewport: tighter padding, smaller title, and no
     sideways scroll from long social links (the card link itself wraps too). */
  #qw-body{overflow-wrap:anywhere;}
  #qw-body img, #qw-body video{max-width:100%;}
  @media(max-width:480px){
    #s-public-work .landing-nav{padding:14px 16px;}
    #s-public-work .section-page{padding:28px 16px !important;}
    #qw-body h2{font-size:22px !important;}
  }
</style>
  <nav class="landing-nav">
    <div class="landing-logo" style="cursor:pointer;display:flex;align-items:center;gap:8px;color:#fff;" onclick="go('s-landing')"><img src="images/logo.png" alt="Artfolio" class="site-logo-img" style="filter:brightness(0) invert(1);"><span>Artfolio</span></div>
    <div class="landing-nav-right">
      <button class="btn-login-nav" onclick="go('s-landing')">LOGIN</button>
    </div>
  </nav>
  <div class="section-page" style="max-width:640px;">
    <div id="qw-body">
      <div style="font-size:13px;color:var(--text3);padding:40px 0;text-align:center;">Loading…</div>
    </div>
  </div>
</div>
