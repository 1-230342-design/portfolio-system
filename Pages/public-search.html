<div class="screen" id="s-public-search" style="background:#f7f5ee;min-height:100vh;">
<style>
  #s-public-search .section-page{padding-top:40px;}
  #s-public-search h2{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,36px);color:var(--dark);margin-bottom:8px;}
  #s-public-search .section-title{font-family:'Fraunces',serif;font-size:20px;color:var(--dark);margin-bottom:14px;}
</style>
  <nav class="landing-nav" style="background:var(--dark);border-bottom:none;">
    <div class="landing-logo" style="cursor:pointer;display:flex;align-items:center;gap:8px;" onclick="go('s-landing')">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:11px;">
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><img src="images/asia.png" alt="ASIATECH" class="site-logo-img" style="height:17px;"></span>
        <span style="width:1px;height:16px;background:rgba(255,255,255,.24);"></span>
        <img src="images/logo.png" alt="Artfolio" class="site-logo-img" style="height:18px;filter:brightness(0) invert(1);">
      </div>
      <span style="color:#fff;">Artfolio</span>
    </div>
    <div class="landing-nav-right">
      <div class="search-bar-nav" style="cursor:text;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:rgba(255,255,255,.6);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="public-search-input-2" placeholder="Search Name or Student" style="border:none;outline:none;background:transparent;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;width:100%;" onkeydown="if(event.key==='Enter')runLandingSearch('public-search-input-2')"/>
      </div>
      <a onclick="browseAllStudents()" style="font-size:12px;color:rgba(255,255,255,.7);cursor:pointer;text-decoration:underline;white-space:nowrap;">Browse All Students</a>
      <button class="btn-login-nav" onclick="go('s-landing')">LOGIN</button>
    </div>
  </nav>
  <div class="section-page" style="position:relative;z-index:1;">
    <h2>Search Results</h2>
    <p id="public-search-summary" style="margin-bottom:28px;font-size:14px;color:var(--text3);">—</p>

    <!-- STEP 1: Sections (tap a section to see the students enrolled in it) -->
    <div id="public-search-sections">
      <div class="students-list" id="public-search-results"></div>
    </div>

    <!-- STEP 2: Students inside one section (tap a student to view their public portfolio) -->
    <div id="public-search-in-section" style="display:none">
      <div style="margin-bottom:20px;cursor:pointer;color:var(--text3);font-size:13px;" onclick="backToPublicSections()">← Back to Sections</div>
      <div class="section-title" id="pss-section-title">—</div>
      <div class="students-list" id="public-search-section-students"></div>
    </div>
  </div>
</div>
